<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Chatree Kengpipat — SAP FI/CO Functional Consultant</title>
  <desc id="desc">Engineering-red social preview for Chatree Kengpipat's SAP FI/CO portfolio.</desc>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e08a81"/>
      <stop offset="0.55" stop-color="#7d1f24"/>
      <stop offset="1" stop-color="#d6a65f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1000 110) rotate(135) scale(570 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7d1f24" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#100c0d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#e08a81" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#100c0d"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="34" y="34" width="1132" height="562" rx="26" fill="#181214" stroke="#3b292d"/>
  <rect x="34" y="34" width="1132" height="562" rx="26" fill="url(#grid)"/>
  <rect x="34" y="34" width="9" height="562" rx="5" fill="url(#rail)"/>

  <g transform="translate(86 76)" filter="url(#shadow)">
    <rect width="42" height="42" rx="10" fill="#100c0d" stroke="#3b292d"/>
    <path d="M21 8 34 21 21 34 8 21Z" fill="#e08a81"/>
    <path d="m21 8 13 13H21Z" fill="#d6a65f"/>
    <path d="m21 13 8 8-8 8-8-8Z" fill="#7d1f24"/>
  </g>

  <text x="150" y="103" fill="#d6a65f" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" letter-spacing="3">SAP FI/CO · FUNCTIONAL DESIGN · TESTING &amp; CONTROLS</text>
  <line x1="86" y1="139" x2="1114" y2="139" stroke="#3b292d"/>

  <text x="86" y="251" fill="#fff8ef" font-family="Arial, 'Segoe UI', sans-serif" font-size="84" font-weight="900" letter-spacing="-3">CHATREE</text>
  <text x="86" y="330" fill="#e08a81" font-family="Arial, 'Segoe UI', sans-serif" font-size="84" font-weight="900" letter-spacing="-3">KENGPIPAT</text>

  <text x="86" y="388" fill="#f0e7df" font-family="Arial, 'Segoe UI', sans-serif" font-size="28" font-weight="700">Turning finance requirements into controlled, testable ERP delivery.</text>
  <text x="86" y="429" fill="#b7a9a8" font-family="Arial, 'Segoe UI', sans-serif" font-size="21">SAP Functional Consultant · S/4HANA FI-Tax · Accenture</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700">
    <g transform="translate(86 476)">
      <rect width="224" height="48" rx="12" fill="#211719" stroke="#54373c"/>
      <circle cx="23" cy="24" r="5" fill="#e08a81"/>
      <text x="40" y="30" fill="#f0e7df">S/4HANA FI-TAX</text>
    </g>
    <g transform="translate(326 476)">
      <rect width="224" height="48" rx="12" fill="#211719" stroke="#54373c"/>
      <circle cx="23" cy="24" r="5" fill="#67b7a2"/>
      <text x="40" y="30" fill="#f0e7df">4 ERP GO-LIVES</text>
    </g>
    <g transform="translate(566 476)">
      <rect width="238" height="48" rx="12" fill="#211719" stroke="#54373c"/>
      <circle cx="23" cy="24" r="5" fill="#d6a65f"/>
      <text x="40" y="30" fill="#f0e7df">UAT TO HYPERCARE</text>
    </g>
  </g>

  <text x="1114" y="566" text-anchor="end" fill="#e08a81" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" letter-spacing="1">chatreekengpipat.github.io</text>
